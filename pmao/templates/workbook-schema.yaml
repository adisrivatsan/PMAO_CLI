# workbook.xlsx schema
# Documents the five tabs generated by `pmao export` / `pmao ingest`.

tabs:
  - name: Initiatives
    description: One row per initiative. Primary tracking view.
    columns:
      - initiative_id
      - initiative
      - coordination_owner
      - responsible_owner
      - status
      - priority
      - current_state
      - coordination_next_steps
      - outstanding_questions
      - outstanding_meetings
      - last_touch_comment
      - last_touch_timestamp
      - syndication_notes
      - materials_link
      - notes

  - name: Next Steps Log
    description: Flattened view of coordination next steps per initiative.
    columns:
      - initiative_id
      - initiative
      - coordination_next_steps
      - date_captured

  - name: Last Touch Log
    description: History of the most recent touch comment and timestamp per initiative.
    columns:
      - initiative_id
      - initiative
      - last_touch_timestamp
      - last_touch_comment

  - name: Meeting Requests
    description: Outstanding meeting requests tied to initiatives.
    columns:
      - initiative_ids
      - initiative
      - meeting_title
      - duration
      - suggested_date
      - attendees
      - scheduler_responsible
      - notes
      - status

  - name: Milestones
    description: Key dates and milestones across all initiatives.
    columns:
      - date
      - end_date
      - title
      - type
      - priority
      - initiative_ids
      - context
      - status

status_values:
  - not_started
  - in_progress
  - ready
  - complete

priority_values:
  - high
  - medium
  - low
